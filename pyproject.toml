[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xyron"
version = "0.1.0"
description = "XYRON - One Bot. Every Feature."
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[ext]==22.6",
    "SQLAlchemy[asyncio]==2.0.44",
    "aiosqlite==0.21.0",
    "alembic==1.16.5",
    "python-dotenv==1.1.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.0"]
postgres = ["asyncpg==0.30.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]