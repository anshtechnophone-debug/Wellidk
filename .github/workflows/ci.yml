name: XYRON CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run integration and command-registration tests
        run: pytest -q tests/test_music_plugin.py tests/test_bootstrap.py tests/test_help_menu.py tests/test_config.py
      - name: Lint music integration
        run: ruff check --select F app/modules/music app/config.py app/core/command_registry.py
